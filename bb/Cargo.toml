[package]
name = "bb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tui"
path = "src/bin/tui.rs"

[[bin]]
name = "tcp"
path = "src/bin/tcp.rs"

[dependencies]
color-eyre  = "0.6.5"
crossterm   = "0.29.0"
ratatui     = { version = "0.29.0", features = ["termwiz"] }
termwiz     = "0.22"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rand        = "0.8"
sqlx        = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono"] }
chrono      = { version = "0.4", features = ["serde"] }